apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: kserve
data:
  deploy: |
    {
      "defaultDeploymentMode": "Standard"
    }
  ingress: |
    {
      "enableGatewayApi": true,
      "kserveIngressGateway": "envoy-gateway-system/kserve-gateway",
      "ingressGateway": "knative-serving/knative-ingress-gateway",
      "ingressDomain": "example.com",
      "domainTemplate": "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}",
      "urlScheme": "http"
    }
  storageInitializer: |
    {
      "image": "kserve/storage-initializer:latest",
      "memoryRequest": "100Mi",
      "memoryLimit": "1Gi",
      "cpuRequest": "100m",
      "cpuLimit": "1",
      "caBundleConfigMapName": "",
      "caBundleVolumeMountPath": "/etc/ssl/custom-certs",
      "enableModelcar": true,
      "cpuModelcar": "10m",
      "memoryModelcar": "15Mi",
      "uidModelcar": 1010
    }
  logger: |
    {
      "image": "kserve/agent:latest",
      "memoryRequest": "100Mi",
      "memoryLimit": "1Gi",
      "cpuRequest": "100m",
      "cpuLimit": "1",
      "defaultUrl": "http://default-broker"
    }
  batcher: |
    {
      "image": "kserve/agent:latest",
      "memoryRequest": "1Gi",
      "memoryLimit": "1Gi",
      "cpuRequest": "1",
      "cpuLimit": "1",
      "maxBatchSize": "32",
      "maxLatency": "5000"
    }
  agent: |
    {
      "image": "kserve/agent:latest",
      "memoryRequest": "100Mi",
      "memoryLimit": "1Gi",
      "cpuRequest": "100m",
      "cpuLimit": "1"
    }
  router: |
    {
      "image": "kserve/router:latest",
      "memoryRequest": "100Mi",
      "memoryLimit": "1Gi",
      "cpuRequest": "100m",
      "cpuLimit": "1",
      "imagePullPolicy": "IfNotPresent"
    }
